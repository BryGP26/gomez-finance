<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gómez Finance - Registro</title>
    <style>
        :root {
            --primary: #1a73e8;
            --success: #28a745;
            --bg: #f0f2f5;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
        }
        h2 { color: var(--primary); text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
        
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; font-size: 14px; }
        select, input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
            outline-color: var(--primary);
        }
        
        button { 
            width: 100%; 
            padding: 15px; 
            background-color: var(--success); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        button:active { transform: scale(0.98); background-color: #218838; }
        
        .success-msg { 
            color: var(--success); 
            text-align: center; 
            font-weight: bold; 
            display: none; 
            margin-top: 15px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Gómez-Finance 💰</h2>
    <p class="subtitle">Registrar Nuevo Gasto</p>

    <label>Fecha</label>
    <input type="date" id="fecha">

    <label>Mes</label>
    <select id="mes">
        <option value="Enero">Enero</option>
        <option value="Febrero">Febrero</option>
        <option value="Marzo">Marzo</option>
        <option value="Abril" selected>Abril</option>
        <option value="Mayo">Mayo</option>
        <option value="Junio">Junio</option>
        <option value="Julio">Julio</option>
        <option value="Agosto">Agosto</option>
        <option value="Septiembre">Septiembre</option>
        <option value="Octubre">Octubre</option>
        <option value="Noviembre">Noviembre</option>
        <option value="Diciembre">Diciembre</option>
    </select>

    <label>Categoría</label>
    <select id="categoria">
        <option value="Supermercado">🛒 Supermercado</option>
        <option value="Combustible">⛽ Combustible</option>
        <option value="Salud">💊 Salud / Farmacia</option>
        <option value="Diario">📅 Gasto Diario</option>
        <option value="Servicios">💡 Servicios Públicos</option>
        <option value="Otros">✨ Otros</option>
    </select>

    <label>Comercio / Lugar</label>
    <input type="text" id="comercio" placeholder="Ej: Walmart, Gasolinera, etc.">

    <label>Descripción</label>
    <input type="text" id="descripcion" placeholder="¿Qué se compró?">

    <label>Monto (₡)</label>
    <input type="number" id="monto" placeholder="Ej: 25000">

    <button id="btnGuardar">Guardar Gasto</button>
    <div id="msg" class="success-msg">✅ ¡Gasto guardado con éxito!</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Tu configuración real de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCq1uBRlyOeez3sbwZrpngvXVAEg8lb2hw",
        authDomain: "gomez-finance-94b2c.firebaseapp.com",
        projectId: "gomez-finance-94b2c",
        storageBucket: "gomez-finance-94b2c.firebasestorage.app",
        messagingSenderId: "23675517740",
        appId: "1:23675517740:web:6d2b44cd72b04fba29ca89"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Poner la fecha de hoy por defecto
    document.getElementById('fecha').valueAsDate = new Date();

    // Función para guardar
    document.getElementById("btnGuardar").addEventListener("click", async () => {
        const fecha = document.getElementById("fecha").value;
        const mes = document.getElementById("mes").value;
        const cat = document.getElementById("categoria").value;
        const com = document.getElementById("comercio").value;
        const desc = document.getElementById("descripcion").value;
        const mon = document.getElementById("monto").value;

        if (fecha && desc && mon) {
            try {
                await addDoc(collection(db, "gastos"), {
                    fecha: fecha,
                    mes: mes,
                    categoria: cat,
                    comercio: com,
                    descripcion: desc,
                    monto: Number(mon),
                    timestamp: new Date()
                });
                
                // Mostrar mensaje de éxito
                const msgDiv = document.getElementById("msg");
                msgDiv.style.display = "block";
                
                // Limpiar campos de texto
                document.getElementById("comercio").value = "";
                document.getElementById("descripcion").value = "";
                document.getElementById("monto").value = "";
                
                setTimeout(() => { msgDiv.style.display = "none"; }, 3000);
            } catch (e) {
                alert("Error al conectar con Firebase: " + e.message);
            }
        } else {
            alert("Por favor completa la fecha, descripción y monto.");
        }
    });
</script>

</body>
</html>
