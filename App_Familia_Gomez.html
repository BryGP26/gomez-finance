<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gomez Finance</title>
  
  <div id="formulario-gastos" style="padding: 20px; border: 1px solid #ccc; border-radius: 10px; max-width: 400px; margin: 20px auto;">
  <h3>Registrar Nuevo Gasto</h3>
  
  <label>Descripción:</label><br>
  <input type="text" id="descripcion" placeholder="Ej: Pago de luz" style="width: 100%; margin-bottom: 10px;"><br>
  
  <label>Monto (₡):</label><br>
  <input type="number" id="monto" placeholder="Ej: 15000" style="width: 100%; margin-bottom: 20px;"><br>
  
  <button id="btnGuardar" style="background-color: #28a745; color: white; padding: 10px; border: none; border-radius: 5px; width: 100%; cursor: pointer;">
    Guardar Gasto
  </button>
</div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body { font-family: Arial; margin:0; background:#0f172a; color:white; }
    header { padding:1rem; text-align:center; background:linear-gradient(90deg,#06b6d4,#3b82f6); font-size:1.5rem; }
    .container { max-width:1000px; margin:auto; padding:1rem; }
    input, select, button { padding:0.5rem; margin:0.3rem; border-radius:8px; border:none; }
    button { background:#22c55e; color:white; cursor:pointer; }
    table { width:100%; border-collapse:collapse; margin-top:1rem; }
    th, td { padding:0.5rem; border-bottom:1px solid #334155; text-align:center; }
    th { background:#1e293b; }
    .total { text-align:right; margin-top:1rem; font-size:1.2rem; }
  </style>
</head>
<body>

<header>💰 Gomez Finance</header>

<div class="container">

  <select id="mes"></select>
  <input type="date" id="fecha">
  <input type="text" id="descripcion" placeholder="Comercio">

  <select id="categoria">
    <option>Supermercado</option>
    <option>Gasolina</option>
    <option>Comida</option>
    <option>Servicios</option>
    <option>Otros</option>
  </select>

  <input type="number" id="monto" placeholder="Monto ₡">
  <button id="btnAgregar">Agregar</button>

  <table>
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Compra</th>
        <th>Categoría</th>
        <th>Monto</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>

  <div class="total">Total: ₡<span id="total">0</span></div>

  <canvas id="grafico"></canvas>

  <button id="btnExcel">Exportar a Excel</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyCq1uBRlyOeez3sbwZrpngvXVAEg8lb2hw",
  authDomain: "gomez-finance-94b2c.firebaseapp.com",
  projectId: "gomez-finance-94b2c",
  storageBucket: "gomez-finance-94b2c.firebasestorage.app",
  messagingSenderId: "23675517740",
  appId: "1:23675517740:web:6d2b44cd72b04fba29ca89"
};

if(firebaseConfig.apiKey.includes("TU_API_KEY")){
  alert("⚠️ Configura Firebase correctamente");
  throw new Error("Firebase no configurado");
}

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let gastos = [];
let chart;

const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

window.addEventListener('DOMContentLoaded', () => {

  const selectMes = document.getElementById('mes');

  meses.forEach(m => {
    const option = document.createElement('option');
    option.value = m;
    option.textContent = m;
    selectMes.appendChild(option);
  });

  document.getElementById('btnAgregar').addEventListener('click', agregar);
  document.getElementById('btnExcel').addEventListener('click', exportarExcel);
  selectMes.addEventListener('change', render);

  escuchar();
});

async function agregar(){
  try {
    const data = {
      fecha: document.getElementById('fecha').value,
      descripcion: document.getElementById('descripcion').value,
      categoria: document.getElementById('categoria').value,
      monto: parseFloat(document.getElementById('monto').value),
      mes: document.getElementById('mes').value
    };

    if(!data.fecha || !data.descripcion || isNaN(data.monto)){
      alert('Completa todos los campos');
      return;
    }

    await addDoc(collection(db, "gastos"), data);

  } catch (error) {
    console.error(error);
    alert("Error guardando datos");
  }
}

function escuchar(){
  onSnapshot(collection(db, "gastos"), snapshot=>{
    gastos = [];
    snapshot.forEach(docu=>gastos.push({id:docu.id,...docu.data()}));
    render();
  });
}

window.eliminar = async function(id){
  await deleteDoc(doc(db, "gastos", id));
}

function render(){
  const tbody = document.getElementById('tabla');
  const totalEl = document.getElementById('total');
  const mesActual = document.getElementById('mes').value;

  tbody.innerHTML = '';

  let total=0;
  let categorias = {};

  gastos.filter(g=>g.mes===mesActual).forEach(g=>{
    total += g.monto;
    categorias[g.categoria] = (categorias[g.categoria]||0)+g.monto;

    tbody.innerHTML += `
      <tr>
        <td>${g.fecha}</td>
        <td>${g.descripcion}</td>
        <td>${g.categoria}</td>
        <td>${g.monto}</td>
        <td><button onclick="eliminar('${g.id}')">❌</button></td>
      </tr>`;
  });

  totalEl.textContent = total.toLocaleString();
  dibujarGrafico(categorias);
}

function dibujarGrafico(data){
  const ctx = document.getElementById('grafico');
  if(chart) chart.destroy();

  chart = new Chart(ctx,{
    type:'pie',
    data:{
      labels:Object.keys(data),
      datasets:[{data:Object.values(data)}]
    }
  });
}

function exportarExcel(){
  const ws = XLSX.utils.json_to_sheet(gastos);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Gastos");
  XLSX.writeFile(wb, "gastos.xlsx");
}

</script>

<div id="app-container" style="max-width: 500px; margin: auto; font-family: sans-serif; padding: 20px;">
    <div style="background: #f4f4f4; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; color: #333;">Registrar Gasto</h2>
        
        <label>Categoría:</label>
        <select id="categoria" style="width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px;">
            <option value="Gasolina">Gasolina</option>
            <option value="Comida">Comida</option>
            <option value="Servicios">Servicios</option>
            <option value="Otros">Otros</option>
        </select>

        <label>Descripción:</label>
        <input type="text" id="descripcion" placeholder="¿En qué se gastó?" style="width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc;">

        <label>Monto (₡):</label>
        <input type="number" id="monto" placeholder="Monto total" style="width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc;">

        <button id="btnGuardar" style="width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px;">

        </button>
    </div>
</div>

<script type="module">
  // Importamos lo necesario de Firestore
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // app es la variable que definiste arriba en tu configuración
  const db = getFirestore(app);

  document.getElementById("btnGuardar").addEventListener("click", async () => {
    const categoria = document.getElementById("categoria").value;
    const descripcion = document.getElementById("descripcion").value;
    const monto = document.getElementById("monto").value;

    if (descripcion && monto) {
      try {
        await addDoc(collection(db, "gastos"), {
          categoria: categoria,
          descripcion: descripcion,
          monto: Number(monto),
          fecha: new Date().toISOString().split('T')[0], // Guarda solo AAAA-MM-DD
          mes: "Abril" // Podrías hacerlo dinámico después
        });
        alert("¡Gasto guardado para la Familia Gómez!");
        // Limpiar campos
        document.getElementById("descripcion").value = "";
        document.getElementById("monto").value = "";
      } catch (error) {
        console.error("Error al guardar: ", error);
        alert("Error al conectar con Firebase.");
      }
    } else {
      alert("Por favor, completa los datos.");
    }
  });
</script>
</body>
</html>
