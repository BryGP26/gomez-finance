<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gómez Finance - Dashboard Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2563eb; --bg: #f5f6fb; --card: #ffffff; --ink: #0f1117;
            --muted: #8b8fa8; --border: #e4e6f0; --danger: #ef4444; --success: #16a34a;
            --radius: 14px; --shadow: 0 4px 12px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); padding-bottom: 40px; }

        .header { background: var(--ink); padding: 18px 24px; color: #fff; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header-logo { font-size: 20px; font-weight: 700; }
        .header-logo span { color: #60a5fa; }

        .nav-tabs { display: flex; gap: 6px; background: var(--card); border-radius: var(--radius); padding: 6px; margin: 20px auto; max-width: 860px; box-shadow: var(--shadow); width: calc(100% - 32px); }
        .nav-tab { flex: 1; padding: 12px; border: none; border-radius: 10px; background: transparent; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .2s; text-align: center; font-size: 11px; text-transform: uppercase; }
        .nav-tab.active { background: var(--ink); color: #fff; }

        .container { max-width: 860px; margin: 0 auto; padding: 0 16px; }
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; background: #fff; }

        .filter-label { font-size: 11px; font-weight: 700; color: var(--muted); margin: 15px 0 8px 0; display: block; text-transform: uppercase; }
        .chips-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .chip { padding: 8px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; cursor: pointer; background: #fff; transition: all 0.2s ease; user-select: none; }
        .chip.active { background: var(--ink); color: white; border-color: var(--ink); }
        .chip-all.active { background: var(--success); border-color: var(--success); }

        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-ghost { background: var(--bg); color: var(--ink); border: 1px solid var(--border); }

        .live-sum-card { background: var(--ink); color: white; border-radius: var(--radius); padding: 20px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .live-sum-card div { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 700; color: #60a5fa; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 14px; color: var(--muted); border-bottom: 2px solid var(--border); font-size: 11px; }
        td { padding: 14px; border-bottom: 1px solid var(--border); }
        .monto-col { font-family: 'DM Mono', monospace; font-weight: bold; text-align: right; }
        .total-row { background: #f8fafc; font-weight: 700; }
        .btn-icon { border: none; background: #f1f5f9; cursor: pointer; padding: 8px; border-radius: 8px; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--card); border-radius: var(--radius); padding: 16px; text-align: center; box-shadow: var(--shadow); }
    </style>
</head>
<body>

<div class="header">
    <div class="header-logo">Gómez<span>Finance</span> 💎</div>
    <div id="reloj" style="font-size: 12px; font-family: 'DM Mono';"></div>
</div>

<nav class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('gastos')">Registro</button>
    <button class="nav-tab" onclick="switchTab('historial')">Historial</button>
    <button class="nav-tab" onclick="switchTab('presupuesto')">Ajustes</button>
    <button class="nav-tab" onclick="switchTab('resumen')">Resumen</button>
</nav>

<div class="container">
    
    <div id="view-gastos" class="view active">
        <div class="card">
            <div class="card-title">📝 Nuevo Gasto</div>
            <input type="hidden" id="editId">
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label>Mes de Control (Selecciona uno o más)</label>
                <div class="chips-container" id="mesesRegistro"></div>
            </div>

            <div class="form-grid">
                <div class="form-group"><label>Fecha</label><input type="date" id="fecha"></div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="categoria"></select>
                </div>
                <div class="form-group"><label>Comercio / Detalle</label><input type="text" id="comercio" placeholder="Ej: Supermercado"></div>
                <div class="form-group"><label>Monto (₡)</label><input type="number" id="monto" placeholder="0"></div>
            </div>
            
            <div class="btn-row">
                <button id="btnGuardar" class="btn btn-primary">💾 Guardar Movimiento</button>
                <button id="btnActualizar" class="btn btn-success" style="display:none;">🔄 Actualizar</button>
                <button id="btnCancelar" class="btn btn-ghost" style="display:none;" onclick="limpiar()">Cancelar</button>
            </div>

            <div class="live-sum-card">
                <div><small id="txtSumaMes">Acumulado Seleccionado</small><div id="sumaRegistro">₡0</div></div>
                <span style="font-size: 24px;">📈</span>
            </div>
        </div>
    </div>

    <div id="view-historial" class="view">
        <div class="card">
            <div class="card-title">🔍 Filtros de Consulta</div>
            <span class="filter-label">Por Meses</span>
            <div class="chips-container" id="filtrosMeses"></div>
            <span class="filter-label">Por Categorías</span>
            <div class="chips-container" id="filtrosCategorias"></div>

            <div style="overflow-x: auto; margin-top: 10px;">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Categoría</th>
                            <th style="text-align:right">Monto</th>
                            <th style="text-align:center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                    <tfoot>
                        <tr class="total-row">
                            <td colspan="2">TOTAL FILTRADO</td>
                            <td id="totalHistorial" class="monto-col" style="color:var(--primary)">₡0</td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <div id="view-presupuesto" class="view">
        <div class="card">
            <div class="card-title">⚙️ Configuración</div>
            <label>Presupuesto Mensual (₡)</label>
            <input type="number" id="inputPresupuesto" value="0" onchange="calcStats()">
        </div>
    </div>

    <div id="view-resumen" class="view">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Límite</div><div class="stat-value" id="valPres">₡0</div></div>
            <div class="stat-card"><div class="stat-label">Gastado</div><div class="stat-value" id="valGasto" style="color:var(--danger)">₡0</div></div>
            <div class="stat-card"><div class="stat-label">Libre</div><div class="stat-value" id="valLibre" style="color:var(--success)">₡0</div></div>
        </div>
        <button class="btn btn-success" id="btnExportar" style="width: 100%;">📥 Exportar Excel</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCq1uBRlyOeez3sbwZrpngvXVAEg8lb2hw",
        authDomain: "gomez-finance-94b2c.firebaseapp.com",
        projectId: "gomez-finance-94b2c",
        storageBucket: "gomez-finance-94b2c.firebasestorage.app",
        messagingSenderId: "23675517740",
        appId: "1:23675517740:web:6d2b44cd72b04fba29ca89"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "gastos");

    let todosLosGastos = [];
    
    // ESTADO DE SELECCIÓN
    let mesesRegistroSeleccionados = ["Abril"]; // Mes por defecto
    let filtrosSeleccionados = { meses: ["Abril"], cats: [] };

    const listaMeses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    const listaCats = [
        "🛒 Supermercado", "⛽ Combustible", "💊 Salud y Medicina", 
        "🍔 Restaurantes", "💡 Electricidad", "💧 Agua", 
        "🏠 Alquiler/Casa", "🚌 Transporte", "💄 Belleza", 
        "🎭 Recreación", "🏊 Natación", "📺 Cable e Internet", "🐾 Mascotas", "✨ Otros"
    ];

    // CARGAR SELECT CATEGORÍA
    const selectCat = document.getElementById("categoria");
    listaCats.forEach(cat => {
        let opt = document.createElement("option");
        opt.value = cat; opt.innerText = cat;
        selectCat.appendChild(opt);
    });

    // LÓGICA DE CHIPS GENÉRICA
    function renderizarChips(lista, contenedorId, arrayEstado, esRegistro = false) {
        const cont = document.getElementById(contenedorId);
        cont.innerHTML = "";
        
        // Botón Todos
        const chipAll = document.createElement("div");
        chipAll.className = `chip chip-all ${arrayEstado.length === lista.length ? 'active' : ''}`;
        chipAll.innerText = "🌟 Todos";
        chipAll.onclick = () => {
            if (arrayEstado.length === lista.length) arrayEstado.length = 0;
            else { arrayEstado.length = 0; arrayEstado.push(...lista); }
            actualizarInterfazChips(contenedorId, lista, arrayEstado);
            if(esRegistro) actualizarSumaRegistro(); else renderizarTablaHistorial();
        };
        cont.appendChild(chipAll);

        lista.forEach(item => {
            const chip = document.createElement("div");
            chip.className = `chip ${arrayEstado.includes(item) ? 'active' : ''}`;
            chip.innerText = item;
            chip.onclick = () => {
                const idx = arrayEstado.indexOf(item);
                if (idx > -1) arrayEstado.splice(idx, 1);
                else arrayEstado.push(item);
                actualizarInterfazChips(contenedorId, lista, arrayEstado);
                if(esRegistro) actualizarSumaRegistro(); else renderizarTablaHistorial();
            };
            cont.appendChild(chip);
        });
    }

    function actualizarInterfazChips(contenedorId, lista, arrayEstado) {
        const cont = document.getElementById(contenedorId);
        const chips = Array.from(cont.querySelectorAll(".chip"));
        chips.forEach(c => {
            if (c.innerText === "🌟 Todos") {
                c.classList.toggle("active", arrayEstado.length === lista.length);
            } else {
                c.classList.toggle("active", arrayEstado.includes(c.innerText));
            }
        });
    }

    // INICIALIZACIÓN
    renderizarChips(listaMeses, "mesesRegistro", mesesRegistroSeleccionados, true);
    renderizarChips(listaMeses, "filtrosMeses", filtrosSeleccionados.meses);
    renderizarChips(listaCats, "filtrosCategorias", filtrosSeleccionados.cats);

    setInterval(() => { document.getElementById('reloj').innerText = new Date().toLocaleTimeString(); }, 1000);
    document.getElementById('fecha').valueAsDate = new Date();

    window.switchTab = (tabId) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('view-' + tabId).classList.add('active');
        if (event && event.currentTarget) event.currentTarget.classList.add('active');
    };

    onSnapshot(query(colRef, orderBy("timestamp", "desc")), (snap) => {
        todosLosGastos = [];
        snap.forEach(d => todosLosGastos.push({ id: d.id, ...d.data() }));
        actualizarSumaRegistro();
        renderizarTablaHistorial();
    });

    // SUMA DINÁMICA DEL REGISTRO (Basada en chips seleccionados)
    window.actualizarSumaRegistro = () => {
        const total = todosLosGastos
            .filter(g => mesesRegistroSeleccionados.includes(g.mes))
            .reduce((acc, c) => acc + c.monto, 0);
        
        const etiqueta = mesesRegistroSeleccionados.length > 1 ? "Acumulado Multimes" : `Acumulado ${mesesRegistroSeleccionados[0] || ''}`;
        document.getElementById("txtSumaMes").innerText = etiqueta;
        document.getElementById("sumaRegistro").innerText = "₡" + total.toLocaleString();
        window.currentTotalSum = total;
        calcStats();
    };

    window.renderizarTablaHistorial = () => {
        const tbody = document.getElementById("cuerpoTabla");
        tbody.innerHTML = "";
        let sumaFiltrada = 0;

        const filtrados = todosLosGastos.filter(g => {
            const mesMatch = filtrosSeleccionados.meses.length === 0 || filtrosSeleccionados.meses.includes(g.mes);
            const catMatch = filtrosSeleccionados.cats.length === 0 || filtrosSeleccionados.cats.includes(g.categoria);
            return mesMatch && catMatch;
        });

        filtrados.forEach(g => {
            sumaFiltrada += g.monto;
            const tr = document.createElement("tr");
            const f = g.fecha.split('-').reverse().join('/');
            tr.innerHTML = `
                <td>${f}</td>
                <td><b>${g.categoria}</b><br><small style="color:var(--muted)">${g.comercio}</small></td>
                <td class="monto-col">₡${g.monto.toLocaleString()}</td>
                <td style="text-align:center"><button class="btn-icon" onclick="prepararEdit('${g.id}')">✏️</button></td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById("totalHistorial").innerText = "₡" + sumaFiltrada.toLocaleString();
    };

    document.getElementById("btnGuardar").onclick = async () => {
        const com = document.getElementById("comercio").value;
        const mon = document.getElementById("monto").value;
        if(!com || !mon || mesesRegistroSeleccionados.length === 0) return alert("Llena los campos y selecciona al menos un mes");
        
        await addDoc(colRef, {
            fecha: document.getElementById("fecha").value,
            mes: mesesRegistroSeleccionados[0], // Se guarda con el primer mes seleccionado
            categoria: document.getElementById("categoria").value,
            comercio: com,
            monto: Number(mon),
            timestamp: new Date()
        });
        limpiar();
    };

    window.prepararEdit = (id) => {
        const g = todosLosGastos.find(x => x.id === id);
        document.getElementById("editId").value = id;
        document.getElementById("fecha").value = g.fecha;
        document.getElementById("categoria").value = g.categoria;
        document.getElementById("comercio").value = g.comercio;
        document.getElementById("monto").value = g.monto;
        
        // Sincronizar chips de registro con el mes del gasto a editar
        mesesRegistroSeleccionados.length = 0;
        mesesRegistroSeleccionados.push(g.mes);
        actualizarInterfazChips("mesesRegistro", listaMeses, mesesRegistroSeleccionados);

        document.getElementById("btnGuardar").style.display = "none";
        document.getElementById("btnActualizar").style.display = "flex";
        document.getElementById("btnCancelar").style.display = "flex";
        switchTab('gastos');
    };

    document.getElementById("btnActualizar").onclick = async () => {
        const id = document.getElementById("editId").value;
        await updateDoc(doc(db, "gastos", id), {
            fecha: document.getElementById("fecha").value,
            mes: mesesRegistroSeleccionados[0],
            categoria: document.getElementById("categoria").value,
            comercio: document.getElementById("comercio").value,
            monto: Number(document.getElementById("monto").value)
        });
        limpiar();
        switchTab('historial');
    };

    window.limpiar = () => {
        document.getElementById("comercio").value = "";
        document.getElementById("monto").value = "";
        document.getElementById("editId").value = "";
        document.getElementById("btnGuardar").style.display = "flex";
        document.getElementById("btnActualizar").style.display = "none";
        document.getElementById("btnCancelar").style.display = "none";
        document.getElementById('fecha').valueAsDate = new Date();
    };

    window.calcStats = () => {
        const pres = Number(document.getElementById("inputPresupuesto").value);
        const gastado = window.currentTotalSum || 0;
        document.getElementById("valPres").innerText = `₡${pres.toLocaleString()}`;
        document.getElementById("valGasto").innerText = `₡${gastado.toLocaleString()}`;
        document.getElementById("valLibre").innerText = `₡${(pres - gastado).toLocaleString()}`;
    };

    document.getElementById("btnExportar").onclick = () => {
        const ws = XLSX.utils.json_to_sheet(todosLosGastos);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Gastos");
        XLSX.writeFile(wb, "Gomez_Finance.xlsx");
    };
</script>
</body>
</html>
