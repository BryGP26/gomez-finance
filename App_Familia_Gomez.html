<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gómez Finance - Master Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb; --bg: #f5f6fb; --card: #ffffff; --ink: #0f1117;
            --muted: #8b8fa8; --border: #e4e6f0; --danger: #ef4444; --success: #16a34a;
            --radius: 14px; --shadow: 0 4px 12px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); padding-bottom: 40px; }

        .header { background: var(--ink); padding: 18px 24px; color: #fff; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header-logo { font-size: 20px; font-weight: 700; }
        .header-logo span { color: #60a5fa; }

        .nav-tabs { display: flex; gap: 6px; background: var(--card); border-radius: var(--radius); padding: 6px; margin: 20px auto; max-width: 900px; box-shadow: var(--shadow); width: calc(100% - 32px); }
        .nav-tab { flex: 1; padding: 12px; border: none; border-radius: 10px; background: transparent; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .2s; text-align: center; font-size: 11px; text-transform: uppercase; }
        .nav-tab.active { background: var(--ink); color: #fff; }

        .container { max-width: 950px; margin: 0 auto; padding: 0 16px; }
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s; }

        .check-group { display: flex; flex-wrap: wrap; gap: 8px; background: #f8fafc; padding: 12px; border-radius: 10px; border: 1px solid var(--border); max-height: 120px; overflow-y: auto; width: 100%; }
        .check-item { display: flex; align-items: center; gap: 6px; background: white; padding: 6px 10px; border-radius: 20px; border: 1px solid var(--border); font-size: 11px; cursor: pointer; user-select: none; }
        .check-item.active { border-color: var(--primary); background: #eff6ff; }

        .btn { padding: 12px 20px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
        .btn-primary { background: var(--primary); color: #fff; width: 100%; }
        .btn-ghost { background: #f1f5f9; color: var(--ink); border: 1px solid var(--border); }
        .btn-small { padding: 4px 8px; font-size: 9px; text-transform: uppercase; background: var(--ink); color: white; border-radius: 4px; cursor: pointer; border: none; }

        .live-sum-card { background: var(--ink); color: white; border-radius: var(--radius); padding: 20px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .live-sum-card div { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 700; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        th { text-align: left; padding: 12px; color: var(--muted); border-bottom: 2px solid var(--border); font-size: 11px; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        
        .chart-box { height: 300px; margin-top: 20px; margin-bottom: 40px; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-logo">Gómez<span>Finance</span> 💎</div>
    <div id="reloj" style="font-size: 12px; font-family: 'DM Mono';"></div>
</div>

<nav class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('gastos')">Registro</button>
    <button class="nav-tab" onclick="switchTab('historial')">Historial</button>
    <button class="nav-tab" onclick="switchTab('resumen')">Analítica</button>
</nav>

<div class="container">
    
    <div id="view-gastos" class="view active">
        <div class="card">
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label>Filtrar Suma de Meses</label>
                    <button class="btn-small" onclick="toggleTodos('registro')">Seleccionar Todos</button>
                </div>
                <div class="check-group" id="checksRegistro"></div>
            </div>
            
            <div class="card-title" style="margin-top: 20px;">📝 Registrar Gasto</div>
            <div class="form-grid">
                <div class="form-group"><label>Fecha</label><input type="date" id="fecha"></div>
                <div class="form-group"><label>Categoría</label><select id="categoria"></select></div>
                <div class="form-group"><label>Detalle</label><input type="text" id="comercio" placeholder="Ej: Supermercado"></div>
                <div class="form-group"><label>Monto (₡)</label><input type="number" id="monto" placeholder="0"></div>
            </div>
            
            <div style="margin-top: 15px; display: flex; gap: 8px;">
                <button id="btnGuardar" class="btn btn-primary">💾 Guardar Registro</button>
                <button id="btnActualizar" class="btn" style="display:none; background:var(--success); color:white;">🔄 Actualizar</button>
                <button id="btnCancelar" class="btn btn-ghost" style="display:none;" onclick="limpiar()">Cancelar</button>
            </div>

            <div class="live-sum-card">
                <div><small>Total Seleccionado</small><div id="sumaRegistro">₡0</div></div>
                <div style="text-align: right;"><small>Balance Proyectado</small><div id="balanceRegistro">₡0</div></div>
            </div>
        </div>
    </div>

    <div id="view-historial" class="view">
        <div class="card">
            <div class="card-title">
                📋 Historial de Movimientos
                <button class="btn-small" onclick="toggleTodos('historial')">Todos los Meses</button>
            </div>
            <div class="form-grid" style="margin-bottom: 15px;">
                <div class="form-group">
                    <label>Meses</label>
                    <div class="check-group" id="checksHistorial"></div>
                </div>
                <div class="form-group">
                    <label>Ajustes de búsqueda</label>
                    <div style="display: flex; gap: 5px;">
                        <select id="filtroAnio" onchange="renderizarTablaHistorial()">
                            <option value="2025">2025</option><option value="2026" selected>2026</option>
                        </select>
                        <select id="filtroCategoria" onchange="renderizarTablaHistorial()"><option value="">Todas</option></select>
                    </div>
                    <input type="text" id="filtroBusqueda" placeholder="🔍 Buscar comercio..." oninput="renderizarTablaHistorial()" style="margin-top:8px">
                </div>
            </div>
            <div style="overflow-x:auto">
                <table>
                    <thead><tr><th>Fecha</th><th>Detalle</th><th style="text-align:right">Monto</th><th style="text-align:center">Acción</th></tr></thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>
            <div class="live-sum-card" style="margin-top: 20px; background: var(--bg); color: var(--ink); border: 1px solid var(--border);">
                <div style="color: var(--primary);"><small>Suma de Filtros</small><div id="totalHistorial">₡0</div></div>
            </div>
        </div>
    </div>

    <div id="view-resumen" class="view">
        <div class="card">
             <div class="card-title">💰 Presupuesto Quincenal (Fijo por Mes)</div>
             <div class="form-grid">
                <div class="form-group"><label>Día 15</label><input type="number" id="pres15" oninput="guardarPresupuesto()"></div>
                <div class="form-group"><label>Día 30</label><input type="number" id="pres30" oninput="guardarPresupuesto()"></div>
             </div>
             <div id="statusP" style="margin-top: 10px; font-size: 12px; color: var(--success);">✔ Se guarda automáticamente</div>
        </div>

        <div class="card">
            <div class="card-title">📊 Visualización de Consumos (2026)</div>
            <div class="chart-box"><canvas id="chartLineal"></canvas></div>
            <div class="chart-box"><canvas id="chartBarras"></canvas></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCq1uBRlyOeez3sbwZrpngvXVAEg8lb2hw",
        authDomain: "gomez-finance-94b2c.firebaseapp.com",
        projectId: "gomez-finance-94b2c",
        storageBucket: "gomez-finance-94b2c.firebasestorage.app",
        messagingSenderId: "23675517740",
        appId: "1:23675517740:web:6d2b44cd72b04fba29ca89"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "gastos");
    let todosLosGastos = [];
    let chartL = null, chartB = null;
    const CLAVE = "212630$";

    const listaMeses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    const listaCats = ["🛒 Supermercado", "⛽ Combustible", "💊 Salud", "🍔 Restaurantes", "💡 Servicios", "🏠 Vivienda", "🚌 Transporte", "🎭 Recreación", "🐾 Mascotas", "✨ Otros"];

    let mesesReg = [listaMeses[new Date().getMonth()]];
    let mesesHist = [listaMeses[new Date().getMonth()]];

    // Cargar Cats
    const selCat = document.getElementById("categoria");
    const filCat = document.getElementById("filtroCategoria");
    listaCats.forEach(c => {
        selCat.innerHTML += `<option value="${c}">${c}</option>`;
        filCat.innerHTML += `<option value="${c}">${c}</option>`;
    });

    function renderizarChecks(contenedorId, listaSeleccionada, callback) {
        const cont = document.getElementById(contenedorId);
        cont.innerHTML = "";
        listaMeses.forEach(m => {
            const item = document.createElement("label");
            const active = listaSeleccionada.includes(m);
            item.className = `check-item ${active ? 'active' : ''}`;
            item.innerHTML = `<input type="checkbox" ${active ? 'checked' : ''} style="display:none"> ${m}`;
            item.onclick = (e) => {
                e.preventDefault();
                if(listaSeleccionada.includes(m)) {
                    const idx = listaSeleccionada.indexOf(m);
                    listaSeleccionada.splice(idx, 1);
                } else {
                    listaSeleccionada.push(m);
                }
                callback();
                renderizarChecks(contenedorId, listaSeleccionada, callback);
            };
            cont.appendChild(item);
        });
    }

    window.toggleTodos = (tipo) => {
        if(tipo === 'registro') {
            mesesReg = mesesReg.length === 12 ? [] : [...listaMeses];
            renderizarChecks("checksRegistro", mesesReg, actualizarSumaRegistro);
            actualizarSumaRegistro();
        } else {
            mesesHist = mesesHist.length === 12 ? [] : [...listaMeses];
            renderizarChecks("checksHistorial", mesesHist, renderizarTablaHistorial);
            renderizarTablaHistorial();
        }
    };

    onSnapshot(query(colRef, orderBy("timestamp", "desc")), (snap) => {
        todosLosGastos = [];
        snap.forEach(d => todosLosGastos.push({ id: d.id, ...d.data() }));
        actualizarSumaRegistro();
        renderizarTablaHistorial();
        if(chartL) actualizarGraficos();
    });

    window.actualizarSumaRegistro = async () => {
        const total = todosLosGastos.filter(g => mesesReg.includes(g.mes)).reduce((acc, c) => acc + c.monto, 0);
        document.getElementById("sumaRegistro").innerText = "₡" + total.toLocaleString();
        
        // Balance
        const mesActual = listaMeses[new Date().getMonth()];
        const anioActual = new Date().getFullYear().toString();
        const docSnap = await getDoc(doc(db, "presupuestos", `${anioActual}_${mesActual}`));
        if(docSnap.exists()){
            const p = docSnap.data();
            const totalP = Number(p.q15 || 0) + Number(p.q30 || 0);
            const bal = totalP - total;
            document.getElementById("balanceRegistro").innerText = "₡" + bal.toLocaleString();
            document.getElementById("balanceRegistro").style.color = bal < 0 ? "red" : "#60a5fa";
        }
    };

    window.renderizarTablaHistorial = () => {
        const fCat = document.getElementById("filtroCategoria").value;
        const fAnio = document.getElementById("filtroAnio").value;
        const fBus = document.getElementById("filtroBusqueda").value.toLowerCase();
        const tbody = document.getElementById("cuerpoTabla");
        tbody.innerHTML = "";
        
        const filtrados = todosLosGastos.filter(g => {
            return mesesHist.includes(g.mes) && (fCat === "" || g.categoria === fCat) && g.fecha.includes(fAnio) && g.comercio.toLowerCase().includes(fBus);
        });

        let suma = 0;
        filtrados.forEach(g => {
            suma += g.monto;
            tbody.innerHTML += `
                <tr>
                    <td>${g.fecha.split('-').reverse().join('/')}</td>
                    <td><b>${g.comercio}</b><br><small>${g.categoria}</small></td>
                    <td style="text-align:right">₡${g.monto.toLocaleString()}</td>
                    <td style="text-align:center">
                        <button class="btn-small" onclick="prepararEdit('${g.id}')">✏️</button>
                        <button class="btn-small" style="background:red" onclick="borrarRegistro('${g.id}')">🗑️</button>
                    </td>
                </tr>`;
        });
        document.getElementById("totalHistorial").innerText = "₡" + suma.toLocaleString();
    };

    window.borrarRegistro = async (id) => {
        const p = prompt("Clave de seguridad:");
        if(p === CLAVE) {
            await deleteDoc(doc(db, "gastos", id));
            alert("Eliminado.");
        } else if(p !== null) alert("Clave incorrecta.");
    };

    window.guardarPresupuesto = async () => {
        const mes = listaMeses[new Date().getMonth()];
        const anio = new Date().getFullYear().toString();
        const q15 = document.getElementById("pres15").value;
        const q30 = document.getElementById("pres30").value;
        await setDoc(doc(db, "presupuestos", `${anio}_${mes}`), { q15, q30 });
        actualizarSumaRegistro();
    };

    async function cargarP() {
        const mes = listaMeses[new Date().getMonth()];
        const anio = new Date().getFullYear().toString();
        const dS = await getDoc(doc(db, "presupuestos", `${anio}_${mes}`));
        if(dS.exists()) {
            document.getElementById("pres15").value = dS.data().q15;
            document.getElementById("pres30").value = dS.data().q30;
        }
    }

    function actualizarGraficos() {
        const dataM = listaMeses.map(m => todosLosGastos.filter(g => g.mes === m && g.fecha.includes("2026")).reduce((s, c) => s + c.monto, 0));
        if(chartL) chartL.destroy();
        chartL = new Chart(document.getElementById('chartLineal'), {
            type: 'line',
            data: { labels: listaMeses, datasets: [{ label: 'Gasto Mensual 2026', data: dataM, borderColor: '#2563eb', fill: true, backgroundColor: 'rgba(37, 99, 235, 0.1)' }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        const dataC = listaCats.map(c => todosLosGastos.filter(g => g.categoria === c).reduce((s, c) => s + c.monto, 0));
        if(chartB) chartB.destroy();
        chartB = new Chart(document.getElementById('chartBarras'), {
            type: 'bar',
            data: { labels: listaCats.map(c => c.split(' ')[1]), datasets: [{ label: 'Gasto por Categoría', data: dataC, backgroundColor: '#1e293b' }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    document.getElementById("btnGuardar").onclick = async () => {
        const com = document.getElementById("comercio").value;
        const mon = document.getElementById("monto").value;
        const fec = document.getElementById("fecha").value;
        if(!com || !mon || !fec) return alert("Faltan datos");
        await addDoc(colRef, {
            fecha: fec,
            mes: listaMeses[new Date(fec + "T00:00:00").getMonth()],
            categoria: document.getElementById("categoria").value,
            comercio: com,
            monto: Number(mon),
            timestamp: new Date()
        });
        limpiar();
    };

    window.switchTab = (id) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('view-' + id).classList.add('active');
        event.currentTarget.classList.add('active');
        if(id === 'resumen') setTimeout(actualizarGraficos, 100);
    };

    renderizarChecks("checksRegistro", mesesReg, actualizarSumaRegistro);
    renderizarChecks("checksHistorial", mesesHist, renderizarTablaHistorial);
    cargarP();
    document.getElementById('fecha').valueAsDate = new Date();
    setInterval(() => { document.getElementById('reloj').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
