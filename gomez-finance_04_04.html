<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gómez Finance</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --ink: #0f1117;
  --ink2: #3a3d4a;
  --muted: #8b8fa8;
  --border: #e4e6f0;
  --bg: #f5f6fb;
  --card: #ffffff;
  --primary: #2563eb;
  --primary-light: #eff4ff;
  --danger: #ef4444;
  --danger-light: #fef2f2;
  --success: #16a34a;
  --success-light: #f0fdf4;
  --warn: #f59e0b;
  --warn-light: #fffbeb;
  --purple: #7c3aed;
  --radius: 14px;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: 40px;
}

/* ── HEADER ── */
.header {
  background: var(--ink);
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-logo {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.5px;
}
.header-logo span { color: #60a5fa; }

/* ── NAV TABS ── */
.nav-tabs {
  display: flex;
  gap: 6px;
  background: var(--card);
  border-radius: var(--radius);
  padding: 6px;
  margin: 20px auto 0;
  max-width: 860px;
  box-shadow: var(--shadow);
  width: calc(100% - 32px);
}
.nav-tab {
  flex: 1;
  padding: 10px 6px;
  border: none;
  border-radius: 10px;
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  transition: all .2s;
  text-align: center;
}
.nav-tab.active {
  background: var(--ink);
  color: #fff;
}
.nav-tab:hover:not(.active) { background: var(--bg); color: var(--ink); }

/* ── CONTAINER ── */
.container {
  max-width: 860px;
  margin: 20px auto 0;
  padding: 0 16px;
}

/* ── VIEWS ── */
.view { display: none; }
.view.active { display: block; }

/* ── CARD ── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
  margin-bottom: 16px;
}
.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title .icon {
  width: 30px; height: 30px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}

/* ── FORM GRID ── */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 560px) {
  .form-grid { grid-template-columns: 1fr; }
}
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.span2 { grid-column: span 2; }
@media (max-width: 560px) { .form-group.span2 { grid-column: span 1; } }

label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
input, select, textarea {
  width: 100%;
  padding: 11px 13px;
  border: 1.5px solid var(--border);
  border-radius: 9px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--ink);
  background: var(--bg);
  transition: border-color .2s;
  outline: none;
}
input:focus, select:focus { border-color: var(--primary); background: #fff; }

/* ── BUTTONS ── */
.btn-row { display: flex; gap: 10px; margin-top: 16px; }
.btn {
  flex: 1;
  padding: 13px 16px;
  border: none;
  border-radius: 9px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #15803d; }
.btn-warn { background: var(--warn); color: #fff; }
.btn-warn:hover { background: #d97706; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-ghost { background: var(--bg); color: var(--ink); border: 1.5px solid var(--border); }
.btn-ghost:hover { background: var(--border); }

/* ── STAT CARDS ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
@media (max-width: 560px) { .stats-row { grid-template-columns: 1fr 1fr; } }

.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.stat-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin-bottom: 6px;
}
.stat-value {
  font-family: 'DM Mono', monospace;
  font-size: 20px;
  font-weight: 500;
  color: var(--ink);
}
.stat-value.danger { color: var(--danger); }
.stat-value.success { color: var(--success); }
.stat-value.warn { color: var(--warn); }

/* ── PROGRESS BAR ── */
.progress-wrap { margin-top: 8px; }
.progress-bar-bg {
  height: 6px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 6px;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width .5s ease;
}
.prog-ok { background: var(--success); }
.prog-warn { background: var(--warn); }
.prog-over { background: var(--danger); }

/* ── TABLA ── */
.filter-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.filter-row select, .filter-row input {
  flex: 1;
  min-width: 120px;
  padding: 9px 12px;
  font-size: 13px;
}

.tabla-wrap { overflow-x: auto; border-radius: 10px; }
table { width: 100%; border-collapse: collapse; min-width: 560px; font-size: 13px; }
thead th {
  background: var(--bg);
  padding: 11px 12px;
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--muted);
  border-bottom: 1.5px solid var(--border);
}
tbody td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--bg); }

.monto-col { font-family: 'DM Mono', monospace; font-weight: 500; color: var(--danger); text-align: right; }
.cat-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  background: var(--primary-light);
  color: var(--primary);
}
.action-btns { display: flex; gap: 6px; }
.btn-icon {
  width: 28px; height: 28px;
  border-radius: 7px;
  border: none;
  cursor: pointer;
  font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.btn-edit { background: var(--primary-light); color: var(--primary); }
.btn-edit:hover { background: var(--primary); color: #fff; }
.btn-del { background: var(--danger-light); color: var(--danger); }
.btn-del:hover { background: var(--danger); color: #fff; }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 14px;
}

/* ── PRESUPUESTO ── */
.budget-category-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.budget-category-row:last-child { border-bottom: none; }
.budget-cat-info { flex: 1; }
.budget-cat-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.budget-cat-nums { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; }
.budget-cat-prog { flex: 2; }
.budget-input-wrap { width: 130px; }
.budget-input-wrap input {
  text-align: right;
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  padding: 8px 10px;
}

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--card);
  border-radius: 18px;
  padding: 24px;
  width: 100%;
  max-width: 500px;
  box-shadow: var(--shadow-lg);
  animation: slideUp .25s ease;
}
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-close {
  background: var(--bg);
  border: none;
  width: 30px; height: 30px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 16px;
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--border); }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--ink);
  color: #fff;
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  z-index: 300;
  transform: translateY(80px);
  opacity: 0;
  transition: all .3s ease;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }

/* ── TAG TOTALS ── */
.month-total-header {
  background: var(--ink);
  color: #fff;
  border-radius: var(--radius);
  padding: 18px 22px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
.month-total-header .label { font-size: 13px; color: #94a3b8; }
.month-total-header .amount { font-family: 'DM Mono', monospace; font-size: 26px; font-weight: 500; }

/* Loading */
.loading {
  text-align: center;
  padding: 30px;
  color: var(--muted);
  font-size: 14px;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-logo">Gómez<span>Finance</span> 💰</div>
  <div id="headerMonth" style="color:#94a3b8;font-size:13px;"></div>
</div>

<!-- NAV -->
<div class="nav-tabs">
  <button class="nav-tab active" onclick="showView('gastos')">➕ Nuevo Gasto</button>
  <button class="nav-tab" onclick="showView('historial')">📋 Historial</button>
  <button class="nav-tab" onclick="showView('presupuesto')">🎯 Presupuesto</button>
  <button class="nav-tab" onclick="showView('resumen')">📊 Resumen</button>
</div>

<div class="container">

  <!-- ═══════════ VIEW: GASTOS ═══════════ -->
  <div class="view active" id="view-gastos">
    <div class="card">
      <div class="card-title"><span class="icon" style="background:#eff4ff">➕</span> Registrar Gasto</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" id="fecha">
        </div>
        <div class="form-group">
          <label>Mes</label>
          <select id="mes">
            <option value="Enero">Enero</option><option value="Febrero">Febrero</option>
            <option value="Marzo">Marzo</option><option value="Abril">Abril</option>
            <option value="Mayo">Mayo</option><option value="Junio">Junio</option>
            <option value="Julio">Julio</option><option value="Agosto">Agosto</option>
            <option value="Septiembre">Septiembre</option><option value="Octubre">Octubre</option>
            <option value="Noviembre">Noviembre</option><option value="Diciembre">Diciembre</option>
          </select>
        </div>
        <div class="form-group">
          <label>Categoría</label>
          <select id="categoria">
            <option value="Supermercado">🛒 Supermercado</option>
            <option value="Combustible">⛽ Combustible</option>
            <option value="Salud">💊 Salud</option>
            <option value="Diario">📅 Diario</option>
            <option value="Servicios">💡 Servicios</option>
            <option value="Restaurante">🍽️ Restaurante</option>
            <option value="Ropa">👕 Ropa</option>
            <option value="Entretenimiento">🎮 Entretenimiento</option>
            <option value="Otros">✨ Otros</option>
          </select>
        </div>
        <div class="form-group">
          <label>Comercio</label>
          <input type="text" id="comercio" placeholder="Ej: Walmart, Shell...">
        </div>
        <div class="form-group span2">
          <label>Detalle del gasto</label>
          <input type="text" id="detalle" placeholder="Ej: Frutas y verduras">
        </div>
        <div class="form-group">
          <label>Monto (₡)</label>
          <input type="number" id="monto" placeholder="0">
        </div>
        <div class="form-group">
          <label>Año</label>
          <input type="number" id="anioInput" placeholder="2025">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-success" id="btnGuardar">💾 Guardar Gasto</button>
        <button class="btn btn-warn" id="btnExportar">📊 Exportar Excel</button>
      </div>
    </div>

    <!-- Mini resumen del mes actual -->
    <div id="miniResumen" class="stats-row"></div>
  </div>

  <!-- ═══════════ VIEW: HISTORIAL ═══════════ -->
  <div class="view" id="view-historial">
    <div class="card">
      <div class="card-title"><span class="icon" style="background:#f0fdf4">📋</span> Historial de Movimientos</div>

      <div class="filter-row">
        <select id="filtroMes" onchange="aplicarFiltros()">
          <option value="">Todos los meses</option>
          <option value="Enero">Enero</option><option value="Febrero">Febrero</option>
          <option value="Marzo">Marzo</option><option value="Abril">Abril</option>
          <option value="Mayo">Mayo</option><option value="Junio">Junio</option>
          <option value="Julio">Julio</option><option value="Agosto">Agosto</option>
          <option value="Septiembre">Septiembre</option><option value="Octubre">Octubre</option>
          <option value="Noviembre">Noviembre</option><option value="Diciembre">Diciembre</option>
        </select>
        <select id="filtroAnio" onchange="aplicarFiltros()">
          <option value="">Todos los años</option>
        </select>
        <select id="filtroCategoria" onchange="aplicarFiltros()">
          <option value="">Todas las categorías</option>
          <option value="Supermercado">🛒 Supermercado</option>
          <option value="Combustible">⛽ Combustible</option>
          <option value="Salud">💊 Salud</option>
          <option value="Diario">📅 Diario</option>
          <option value="Servicios">💡 Servicios</option>
          <option value="Restaurante">🍽️ Restaurante</option>
          <option value="Ropa">👕 Ropa</option>
          <option value="Entretenimiento">🎮 Entretenimiento</option>
          <option value="Otros">✨ Otros</option>
        </select>
        <input type="text" id="filtroBusqueda" placeholder="🔍 Buscar..." style="min-width:140px" oninput="aplicarFiltros()">
      </div>

      <div id="filtroTotalBanner" style="display:none; margin-bottom:12px;"></div>

      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Mes / Año</th>
              <th>Comercio</th>
              <th>Categoría</th>
              <th>Detalle</th>
              <th style="text-align:right">Monto</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cuerpoTabla"></tbody>
        </table>
      </div>
      <div id="tablaEmpty" class="empty-state" style="display:none">
        📭 No hay movimientos con estos filtros
      </div>

      <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn btn-ghost" style="flex:0; padding:10px 16px; font-size:13px" id="btnExportarFiltrado">📊 Exportar filtrado</button>
      </div>
    </div>
  </div>

  <!-- ═══════════ VIEW: PRESUPUESTO ═══════════ -->
  <div class="view" id="view-presupuesto">
    <div class="card">
      <div class="card-title"><span class="icon" style="background:#fffbeb">🎯</span> Presupuesto Mensual</div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr; margin-bottom:16px;">
        <div class="form-group">
          <label>Mes</label>
          <select id="presMes" onchange="cargarPresupuesto()">
            <option value="Enero">Enero</option><option value="Febrero">Febrero</option>
            <option value="Marzo">Marzo</option><option value="Abril">Abril</option>
            <option value="Mayo">Mayo</option><option value="Junio">Junio</option>
            <option value="Julio">Julio</option><option value="Agosto">Agosto</option>
            <option value="Septiembre">Septiembre</option><option value="Octubre">Octubre</option>
            <option value="Noviembre">Noviembre</option><option value="Diciembre">Diciembre</option>
          </select>
        </div>
        <div class="form-group">
          <label>Año</label>
          <select id="presAnio" onchange="cargarPresupuesto()"></select>
        </div>
      </div>
      <div id="presupuestoLista"></div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="guardarPresupuesto()">💾 Guardar Presupuesto</button>
      </div>
    </div>
  </div>

  <!-- ═══════════ VIEW: RESUMEN ═══════════ -->
  <div class="view" id="view-resumen">
    <div class="card">
      <div class="card-title"><span class="icon" style="background:#f5f3ff">📊</span> Resumen por Mes</div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr; margin-bottom:16px;">
        <div class="form-group">
          <label>Mes</label>
          <select id="resMes" onchange="renderResumen()">
            <option value="Enero">Enero</option><option value="Febrero">Febrero</option>
            <option value="Marzo">Marzo</option><option value="Abril">Abril</option>
            <option value="Mayo">Mayo</option><option value="Junio">Junio</option>
            <option value="Julio">Julio</option><option value="Agosto">Agosto</option>
            <option value="Septiembre">Septiembre</option><option value="Octubre">Octubre</option>
            <option value="Noviembre">Noviembre</option><option value="Diciembre">Diciembre</option>
          </select>
        </div>
        <div class="form-group">
          <label>Año</label>
          <select id="resAnio" onchange="renderResumen()"></select>
        </div>
      </div>
      <div id="resumenContenido"></div>
    </div>
  </div>

</div><!-- /container -->

<!-- ═══════ MODAL EDITAR ═══════ -->
<div class="modal-overlay" id="modalEditar">
  <div class="modal-box">
    <div class="modal-title">
      ✏️ Editar Gasto
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="editFecha">
      </div>
      <div class="form-group">
        <label>Mes</label>
        <select id="editMes">
          <option value="Enero">Enero</option><option value="Febrero">Febrero</option>
          <option value="Marzo">Marzo</option><option value="Abril">Abril</option>
          <option value="Mayo">Mayo</option><option value="Junio">Junio</option>
          <option value="Julio">Julio</option><option value="Agosto">Agosto</option>
          <option value="Septiembre">Septiembre</option><option value="Octubre">Octubre</option>
          <option value="Noviembre">Noviembre</option><option value="Diciembre">Diciembre</option>
        </select>
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select id="editCategoria">
          <option value="Supermercado">🛒 Supermercado</option>
          <option value="Combustible">⛽ Combustible</option>
          <option value="Salud">💊 Salud</option>
          <option value="Diario">📅 Diario</option>
          <option value="Servicios">💡 Servicios</option>
          <option value="Restaurante">🍽️ Restaurante</option>
          <option value="Ropa">👕 Ropa</option>
          <option value="Entretenimiento">🎮 Entretenimiento</option>
          <option value="Otros">✨ Otros</option>
        </select>
      </div>
      <div class="form-group">
        <label>Comercio</label>
        <input type="text" id="editComercio">
      </div>
      <div class="form-group span2">
        <label>Detalle</label>
        <input type="text" id="editDetalle">
      </div>
      <div class="form-group">
        <label>Monto (₡)</label>
        <input type="number" id="editMonto">
      </div>
      <div class="form-group">
        <label>Año</label>
        <input type="number" id="editAnio">
      </div>
    </div>
    <div class="btn-row" style="margin-top:18px;">
      <button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarEdicion()">💾 Guardar Cambios</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc,
  doc, query, orderBy, onSnapshot, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCq1uBRlyOeez3sbwZrpngvXVAEg8lb2hw",
  authDomain: "gomez-finance-94b2c.firebaseapp.com",
  projectId: "gomez-finance-94b2c",
  storageBucket: "gomez-finance-94b2c.firebasestorage.app",
  messagingSenderId: "23675517740",
  appId: "1:23675517740:web:6d2b44cd72b04fba29ca89"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── GLOBALS ──
let todosLosGastos = [];
let editandoId = null;
const categorias = ['Supermercado','Combustible','Salud','Diario','Servicios','Restaurante','Ropa','Entretenimiento','Otros'];
const catEmojis = {
  Supermercado:'🛒', Combustible:'⛽', Salud:'💊', Diario:'📅',
  Servicios:'💡', Restaurante:'🍽️', Ropa:'👕', Entretenimiento:'🎮', Otros:'✨'
};

// Exponer funciones globales
window.showView = showView;
window.aplicarFiltros = aplicarFiltros;
window.cargarPresupuesto = cargarPresupuesto;
window.guardarPresupuesto = guardarPresupuesto;
window.cerrarModal = cerrarModal;
window.guardarEdicion = guardarEdicion;
window.renderResumen = renderResumen;

// ── INIT ──
const hoy = new Date();
const mesActual = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][hoy.getMonth()];
const anioActual = hoy.getFullYear();

document.getElementById('fecha').valueAsDate = hoy;
document.getElementById('mes').value = mesActual;
document.getElementById('anioInput').value = anioActual;
document.getElementById('headerMonth').textContent = `${mesActual} ${anioActual}`;

// Poblar selects de año
['filtroAnio','presAnio','resAnio'].forEach(id => {
  const el = document.getElementById(id);
  for(let y = anioActual; y >= 2023; y--) {
    el.innerHTML += `<option value="${y}">${y}</option>`;
  }
});
document.getElementById('presAnio').value = anioActual;
document.getElementById('resAnio').value = anioActual;
document.getElementById('resMes').value = mesActual;
document.getElementById('presMes').value = mesActual;

// ── TOAST ──
function toast(msg, tipo='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${tipo} show`;
  setTimeout(() => el.className = 'toast', 2800);
}

// ── NAVEGACIÓN ──
function showView(v) {
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(x => x.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  event.currentTarget.classList.add('active');
  if(v === 'presupuesto') cargarPresupuesto();
  if(v === 'resumen') renderResumen();
}

// ── FIRESTORE LISTENER ──
const q = query(collection(db, "gastos"), orderBy("timestamp","desc"));
onSnapshot(q, snap => {
  todosLosGastos = [];
  snap.forEach(d => todosLosGastos.push({ id: d.id, ...d.data() }));
  actualizarFiltroAnios();
  aplicarFiltros();
  renderMiniResumen();
  renderResumen();
});

function actualizarFiltroAnios() {
  const anios = [...new Set(todosLosGastos.map(g => g.anio))].sort((a,b)=>b-a);
  const sel = document.getElementById('filtroAnio');
  const val = sel.value;
  sel.innerHTML = '<option value="">Todos los años</option>';
  anios.forEach(y => sel.innerHTML += `<option value="${y}">${y}</option>`);
  sel.value = val;
}

// ── GUARDAR GASTO ──
document.getElementById('btnGuardar').addEventListener('click', async () => {
  const fecha = document.getElementById('fecha').value;
  const mes = document.getElementById('mes').value;
  const anio = document.getElementById('anioInput').value || String(anioActual);
  const cat = document.getElementById('categoria').value;
  const com = document.getElementById('comercio').value.trim();
  const det = document.getElementById('detalle').value.trim();
  const mon = document.getElementById('monto').value;
  if(!fecha || !mon || !com) { toast('Faltan campos obligatorios','error'); return; }
  try {
    await addDoc(collection(db,'gastos'), {
      fecha, mes, anio: String(anio), categoria: cat, comercio: com,
      detalle: det, monto: Number(mon), timestamp: new Date()
    });
    document.getElementById('comercio').value='';
    document.getElementById('detalle').value='';
    document.getElementById('monto').value='';
    toast('✅ Gasto guardado!');
  } catch(e) { toast('Error: '+e.message,'error'); }
});

// ── MINI RESUMEN ──
function renderMiniResumen() {
  const gastosDelMes = todosLosGastos.filter(g => g.mes === mesActual && g.anio === String(anioActual));
  const total = gastosDelMes.reduce((s,g)=>s+g.monto,0);
  const html = `
    <div class="stat-card">
      <div class="stat-label">Total ${mesActual}</div>
      <div class="stat-value danger">₡${total.toLocaleString()}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Movimientos</div>
      <div class="stat-value">${gastosDelMes.length}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Promedio/día</div>
      <div class="stat-value">₡${gastosDelMes.length ? Math.round(total/new Date(anioActual, hoy.getMonth()+1, 0).getDate()).toLocaleString() : 0}</div>
    </div>`;
  document.getElementById('miniResumen').innerHTML = html;
}

// ── FILTROS ──
function aplicarFiltros() {
  const filtMes = document.getElementById('filtroMes').value;
  const filtAnio = document.getElementById('filtroAnio').value;
  const filtCat = document.getElementById('filtroCategoria').value;
  const busq = document.getElementById('filtroBusqueda').value.toLowerCase();

  let filtrados = todosLosGastos.filter(g => {
    if(filtMes && g.mes !== filtMes) return false;
    if(filtAnio && g.anio !== filtAnio) return false;
    if(filtCat && g.categoria !== filtCat) return false;
    if(busq) {
      const texto = `${g.comercio} ${g.detalle} ${g.categoria}`.toLowerCase();
      if(!texto.includes(busq)) return false;
    }
    return true;
  });

  const tbody = document.getElementById('cuerpoTabla');
  const empty = document.getElementById('tablaEmpty');
  tbody.innerHTML = '';

  if(filtrados.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    filtrados.forEach(g => {
      tbody.innerHTML += `<tr>
        <td>${g.fecha||''}</td>
        <td>${g.mes} ${g.anio||''}</td>
        <td><strong>${g.comercio}</strong></td>
        <td><span class="cat-badge">${catEmojis[g.categoria]||'•'} ${g.categoria}</span></td>
        <td style="color:var(--muted)">${g.detalle||'-'}</td>
        <td class="monto-col">₡${g.monto.toLocaleString()}</td>
        <td>
          <div class="action-btns">
            <button class="btn-icon btn-edit" onclick="abrirEditar('${g.id}')" title="Editar">✏️</button>
            <button class="btn-icon btn-del" onclick="eliminarGasto('${g.id}')" title="Eliminar">🗑️</button>
          </div>
        </td>
      </tr>`;
    });
  }

  // Banner total filtrado
  const total = filtrados.reduce((s,g)=>s+g.monto,0);
  const banner = document.getElementById('filtroTotalBanner');
  if(filtMes || filtAnio || filtCat || busq) {
    banner.style.display = 'block';
    banner.innerHTML = `<div style="background:var(--primary-light);color:var(--primary);padding:10px 14px;border-radius:9px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;">
      <span>📌 ${filtrados.length} movimiento(s) filtrados</span>
      <span>Total: ₡${total.toLocaleString()}</span>
    </div>`;
  } else {
    banner.style.display = 'none';
  }

  window._datosFiltrados = filtrados;
}

// ── EXPORTAR ──
function exportarExcel(datos, nombre) {
  if(!datos.length) { toast('No hay datos','error'); return; }
  const ws = XLSX.utils.json_to_sheet(datos.map(g=>({
    Fecha:g.fecha, Mes:g.mes, Año:g.anio, Comercio:g.comercio,
    Categoría:g.categoria, Detalle:g.detalle, Monto:g.monto
  })));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Gastos");
  XLSX.writeFile(wb, nombre+'.xlsx');
  toast('📊 Exportado!');
}
document.getElementById('btnExportar').addEventListener('click', () => exportarExcel(todosLosGastos,'Gomez_Finance_Completo'));
document.getElementById('btnExportarFiltrado').addEventListener('click', () => exportarExcel(window._datosFiltrados||[],'Gomez_Finance_Filtrado'));

// ── EDITAR ──
window.abrirEditar = function(id) {
  const g = todosLosGastos.find(x=>x.id===id);
  if(!g) return;
  editandoId = id;
  document.getElementById('editFecha').value = g.fecha||'';
  document.getElementById('editMes').value = g.mes||'';
  document.getElementById('editCategoria').value = g.categoria||'';
  document.getElementById('editComercio').value = g.comercio||'';
  document.getElementById('editDetalle').value = g.detalle||'';
  document.getElementById('editMonto').value = g.monto||'';
  document.getElementById('editAnio').value = g.anio||anioActual;
  document.getElementById('modalEditar').classList.add('open');
}

window.cerrarModal = function() {
  document.getElementById('modalEditar').classList.remove('open');
  editandoId = null;
}

window.guardarEdicion = async function() {
  if(!editandoId) return;
  const datos = {
    fecha: document.getElementById('editFecha').value,
    mes: document.getElementById('editMes').value,
    anio: String(document.getElementById('editAnio').value),
    categoria: document.getElementById('editCategoria').value,
    comercio: document.getElementById('editComercio').value,
    detalle: document.getElementById('editDetalle').value,
    monto: Number(document.getElementById('editMonto').value),
  };
  try {
    await updateDoc(doc(db,'gastos',editandoId), datos);
    cerrarModal();
    toast('✅ Gasto actualizado!');
  } catch(e) { toast('Error: '+e.message,'error'); }
}

window.eliminarGasto = async function(id) {
  if(!confirm('¿Eliminar este gasto?')) return;
  try {
    await deleteDoc(doc(db,'gastos',id));
    toast('🗑️ Gasto eliminado');
  } catch(e) { toast('Error: '+e.message,'error'); }
}

// ── PRESUPUESTO ──
window.cargarPresupuesto = async function() {
  const mes = document.getElementById('presMes').value;
  const anio = document.getElementById('presAnio').value;
  const key = `${anio}_${mes}`;

  // Gastos reales del mes
  const gastosDelMes = todosLosGastos.filter(g=>g.mes===mes && g.anio===String(anio));
  const porCat = {};
  categorias.forEach(c => {
    porCat[c] = gastosDelMes.filter(g=>g.categoria===c).reduce((s,g)=>s+g.monto,0);
  });

  // Obtener presupuesto guardado
  let presDatos = {};
  try {
    const snap = await getDoc(doc(db,'presupuestos',key));
    if(snap.exists()) presDatos = snap.data();
  } catch(e){}

  let html = '';
  categorias.forEach(cat => {
    const gastado = porCat[cat]||0;
    const presupuestado = presDatos[cat]||0;
    const pct = presupuestado > 0 ? Math.min((gastado/presupuestado)*100,100) : 0;
    const colorClass = pct >= 100 ? 'prog-over' : pct >= 80 ? 'prog-warn' : 'prog-ok';
    html += `<div class="budget-category-row">
      <div class="budget-cat-info">
        <div class="budget-cat-name">${catEmojis[cat]} ${cat}</div>
        <div class="budget-cat-nums">
          Gastado: <strong>₡${gastado.toLocaleString()}</strong>
          ${presupuestado > 0 ? ` / ₡${presupuestado.toLocaleString()} (${Math.round((gastado/presupuestado)*100)}%)` : ''}
        </div>
      </div>
      <div class="budget-cat-prog">
        ${presupuestado > 0 ? `<div class="progress-bar-bg"><div class="progress-bar-fill ${colorClass}" style="width:${pct}%"></div></div>` : ''}
      </div>
      <div class="budget-input-wrap">
        <input type="number" id="pres_${cat}" value="${presupuestado||''}" placeholder="₡ límite">
      </div>
    </div>`;
  });
  document.getElementById('presupuestoLista').innerHTML = html;
}

window.guardarPresupuesto = async function() {
  const mes = document.getElementById('presMes').value;
  const anio = document.getElementById('presAnio').value;
  const key = `${anio}_${mes}`;
  const datos = {};
  categorias.forEach(cat => {
    const val = document.getElementById('pres_'+cat)?.value;
    if(val) datos[cat] = Number(val);
  });
  try {
    await setDoc(doc(db,'presupuestos',key), datos);
    toast('💾 Presupuesto guardado!');
    cargarPresupuesto();
  } catch(e) { toast('Error: '+e.message,'error'); }
}

// ── RESUMEN ──
window.renderResumen = async function() {
  const mes = document.getElementById('resMes').value;
  const anio = document.getElementById('resAnio').value;
  const key = `${anio}_${mes}`;

  const gastosDelMes = todosLosGastos.filter(g=>g.mes===mes && g.anio===String(anio));
  const total = gastosDelMes.reduce((s,g)=>s+g.monto,0);

  let presDatos = {};
  try {
    const snap = await getDoc(doc(db,'presupuestos',key));
    if(snap.exists()) presDatos = snap.data();
  } catch(e){}

  const totalPresupuestado = Object.values(presDatos).reduce((s,v)=>s+v,0);

  const porCat = {};
  categorias.forEach(c => {
    porCat[c] = gastosDelMes.filter(g=>g.categoria===c).reduce((s,g)=>s+g.monto,0);
  });

  let catRows = categorias
    .filter(c => porCat[c]>0)
    .sort((a,b)=>porCat[b]-porCat[a])
    .map(cat => {
      const pct = total > 0 ? (porCat[cat]/total*100).toFixed(1) : 0;
      const prescat = presDatos[cat]||0;
      const over = prescat > 0 && porCat[cat] > prescat;
      return `<div class="budget-category-row">
        <div class="budget-cat-info" style="flex:2">
          <div class="budget-cat-name">${catEmojis[cat]} ${cat}</div>
          <div class="budget-cat-nums">
            ${pct}% del total${prescat?` · Presupuesto: ₡${prescat.toLocaleString()}`:''}
            ${over?` <span style="color:var(--danger);font-weight:700">⚠️ EXCEDIDO</span>`:''}
          </div>
        </div>
        <div class="budget-cat-prog">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill ${over?'prog-over':'prog-ok'}" style="width:${pct}%"></div>
          </div>
        </div>
        <div style="font-family:'DM Mono',monospace;font-size:14px;font-weight:600;color:var(--danger);min-width:100px;text-align:right">
          ₡${porCat[cat].toLocaleString()}
        </div>
      </div>`;
    }).join('');

  const html = `
    <div class="month-total-header">
      <div><div class="label">Total gastado</div><div class="amount">₡${total.toLocaleString()}</div></div>
      <div style="text-align:right">
        <div class="label">Presupuesto total</div>
        <div class="amount" style="color:${total>totalPresupuestado?'#f87171':'#86efac'}">
          ${totalPresupuestado ? `₡${totalPresupuestado.toLocaleString()}` : 'No definido'}
        </div>
      </div>
    </div>
    <div class="stats-row" style="margin-bottom:16px;">
      <div class="stat-card">
        <div class="stat-label">Movimientos</div>
        <div class="stat-value">${gastosDelMes.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Promedio por gasto</div>
        <div class="stat-value">₡${gastosDelMes.length?Math.round(total/gastosDelMes.length).toLocaleString():0}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Categorías</div>
        <div class="stat-value">${categorias.filter(c=>porCat[c]>0).length}</div>
      </div>
    </div>
    ${catRows || '<div class="empty-state">📭 Sin gastos este mes</div>'}
  `;
  document.getElementById('resumenContenido').innerHTML = html;
}

// Cerrar modal al click afuera
document.getElementById('modalEditar').addEventListener('click', function(e){
  if(e.target === this) cerrarModal();
});

// Inicializar presupuesto
cargarPresupuesto();
</script>
</body>
</html>
